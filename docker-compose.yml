services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
    ports: ["8080:80"]
    depends_on: [mysql]
volumes:
  mysql-data:
